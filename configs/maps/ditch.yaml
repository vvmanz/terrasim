# ditch — a ditch across the path: 35 cm deep, banks up to 25°, a strip of wet clay at the bottom; the field is LETE sand.
# straight — across the ditch; oblique — at 55° to its axis (the wheels go down one after another).
# Run:    bash scripts/drive.sh --map ditch            (scenario 'straight', the robots listed in robots:)
#         bash scripts/drive.sh --map "ditch@*"         (all scenarios: straight, oblique)
#         bash scripts/drive.sh --map ditch@oblique --robot husky --engine harmonic --gui
# Preview: python3 tools/maps.py preview ditch      Format: docs/en/MAPS.md
world:
  name: ditch
  description: 35 cm ditch with clay at the bottom
  tags: [valley, outdoor]
  default_surface: sand_lete
  bounds: {xmin: -2, xmax: 8, ymin: -4, ymax: 4}
  resolution: 0.03
  zones:
    - {surface: clay_wet, type: band, points: [[3, -4], [3, 4]], width: 0.6}   # mud at the bottom
  relief:
    - {type: trench, points: [[3, -5], [3, 5]], width: 1.2, flat: 0.3, height: -0.35}
  robots: [husky, jackal, rover, pioneer]
  scenarios:
    straight: {spawn: [-1, 0, 0], traj: 'line:L=8'}
    oblique: {spawn: [-1, -3, 35], traj: 'line:L=8'}
