# my_first_map — an example map to copy and edit: three surfaces, a road, a hill, a field of bumps and three runs.
# Run it from here:   bash scripts/drive.sh --map examples/maps/my_first_map.yaml              (first scenario: road)
#                     bash scripts/drive.sh --map "examples/maps/my_first_map.yaml@*"          (all scenarios)
#                     bash scripts/drive.sh --map examples/maps/my_first_map.yaml@hill --robot husky --engine harmonic --gui
# Picture:            python3 tools/maps.py preview examples/maps/my_first_map.yaml --out /tmp
# Or copy it to configs/maps/my_first_map.yaml and use the short name: --map my_first_map
# Every key: docs/en/MAPS.md
world:
  name: my_first_map
  description: Example map, road + hill + bumps on three surfaces
  tags: [example]
  default_surface: gray                 # everywhere no zone applies
  bounds: {xmin: -6, xmax: 6, ymin: -5, ymax: 5}
  resolution: 0.02                      # 2 cm grid

  zones:                                # surfaces, painted in order (a later zone wins)
    - {surface: sand_lete, type: rect, xmin: 0, xmax: 6, ymin: -5, ymax: 5}            # right half: sand
    - {surface: wet_carpet, type: circle, center: [-3, 3], radius: 1.2}                # a wet carpet (defined below)
    - {surface: table, type: band, points: [[-5.5, -3], [0, -3], [4, 1]], width: 1.0}  # a 1 m road

  relief:                               # heights, added up in order
    - {type: hill, center: [3, -2], height: 0.4, radius: 2.0}                          # 0.4 m hill on the sand
    - {type: bump_rows, height: 0.05, radius: 0.5, pitch: 1.0, area: [-5, -1, -1, 2], stagger: true}
    - {type: flatten, center: [-5, -3], radius: 0.6, blend: 0.3}                       # flat start pad

  surfaces:                             # a surface that exists only on this map
    wet_carpet: {base: carpet, mu: 0.4, _color: "0.30 0.30 0.45 1"}

  robots: [jackal, husky]               # used when --robot is not given

  scenarios:                            # spawn: [x, y, heading in degrees]
    road: {route: [[-5, -3], [-2, -3], [0, -3], [2, -1], [3.8, 0.8]], speed: 0.6, note: along the road}
    hill: {spawn: [0.5, -2, 0], traj: "line:L=5", speed: 0.5, note: over the top of the hill}
    bumps: {spawn: [-5, 0.5, 0], traj: "line:L=4", speed: 0.4, note: across the bump field}
